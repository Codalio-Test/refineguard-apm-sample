# RefineGuard APM — SecurityAuditEvent  (replaces the PRD's custom AuditLog model)
#
# Gap compensated: G2 (DATA_MODEL_UX_MISMATCH, high). The PRD ERD declares an `AuditLog` model on
# table `audit_logs`, but Rhino v4 already owns that table through Rhino::HasAuditTrail
# (polymorphic change log). Blueprinting a second model on the same table would collide with the
# engine. Model-level change history therefore uses Rhino::HasAuditTrail (see
# diagnostic_incidents / model_baselines / prescriptive_advisories / cmms_work_orders), and this
# distinct resource carries the *security* event stream that /admin/security-audit renders:
# Timestamp, Severity, Actor, Role, Action, Object, Source host, Result (+ IEC 62443 export).
# US-07 AC2 requires the trail to be immutable / append-only: the policy grants no store, update or
# destroy to any role — rows are written server-side by the platform event writer.
model: SecurityAuditEvent
slug: security_audit_events
table: security_audit_events

options:
  belongs_to_organization: true
  soft_deletes: false
  pagination: true
  per_page: 100

columns:
  user_id:
    type: foreignId
    foreign_model: User
    nullable: true
    index: true
    filterable: true
  actor_name:
    type: string
    nullable: true
    filterable: true
    sortable: true
    searchable: true
  actor_role:
    type: string
    nullable: true
    filterable: true
    searchable: true
  action_type:
    type: string
    nullable: false
    filterable: true
    sortable: true
    searchable: true
  entity_affected:
    type: string
    nullable: true
    filterable: true
    searchable: true
  source_host:
    type: string
    nullable: true
    filterable: true
    searchable: true
  severity:
    type: string
    nullable: true
    default: "info"
    filterable: true
    sortable: true
  result:
    type: string
    nullable: true
    default: "Success"
    filterable: true
  recorded_at:
    type: datetime
    nullable: false
    filterable: true
    sortable: true
  tamper_proof_hash:
    type: string
    nullable: false
  previous_hash:
    type: string
    nullable: true
  details_json:
    type: json
    nullable: true

relationships:
  - type: belongsTo
    model: Organization
  - type: belongsTo
    model: User

permissions:
  # Append-only evidence: read-only for admin, invisible to every other role.
  admin:
    actions: [index, show]
    show_fields: "*"
    create_fields: []
    update_fields: []
